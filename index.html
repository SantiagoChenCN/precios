<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Consultar precio</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #69707d;
    --line: #e2e5ea; --accent: #1f6feb; --accent-text: #ffffff;
    --ok: #157f3b; --warn: #b35900; --bad: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --card: #1b2028; --text: #e8ebf0; --muted: #9aa3b0;
      --line: #2c333d; --accent: #4c8dff; --accent-text: #0b0e12;
      --ok: #4cc27a; --warn: #f0a24a; --bad: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .hidden { display: none !important; }
  button, .button {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 52px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-text);
    font: inherit; font-weight: 600; font-size: 17px; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); min-height: 44px; font-size: 15px; }
  button:disabled { opacity: .55; }
  input[type=text], input[type=password] {
    width: 100%; min-height: 48px; padding: 0 14px; font: inherit; font-size: 18px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text);
  }
  .row { display: flex; gap: 10px; }
  .row > input { flex: 1; }
  .row > button { width: auto; padding: 0 20px; }
  .muted { color: var(--muted); font-size: 14px; }
  .status { min-height: 22px; margin-top: 10px; font-size: 15px; }
  .status.bad { color: var(--bad); }
  .result-name { font-size: 18px; font-weight: 600; margin: 0 0 6px; word-break: break-word; }
  .result-price { font-size: 40px; font-weight: 700; color: var(--ok); line-height: 1.1; margin: 4px 0 8px; }
  .result-flag { font-size: 18px; font-weight: 600; margin: 4px 0 8px; }
  .result-flag.warn { color: var(--warn); }
  .result-flag.bad { color: var(--bad); }
  .result-meta { color: var(--muted); font-size: 14px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--warn); color: var(--warn); font-size: 13px; margin-left: 6px; vertical-align: 2px; }
  .item + .item { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .status.ok { color: var(--ok); }
  #report-preview { display: block; max-width: 100%; max-height: 220px; margin: 12px auto 0; border-radius: 10px; }
  #report-form { margin-top: 12px; }
  #preview { display: block; max-width: 100%; max-height: 180px; margin: 12px auto 0; border-radius: 10px; }
  #live { margin-bottom: 10px; }
  #live-video { display: block; width: 100%; max-height: 55vh; object-fit: cover; background: #000; border-radius: 12px; margin-bottom: 8px; }
  #live-scan { margin-bottom: 10px; }
  a.button { text-decoration: none; }
  label.button input { display: none; }
  .button.secondary, label.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); min-height: 44px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Consultar precio</h1>

  <section id="login" class="card hidden">
    <p style="margin-top:0">Ingrese el código de empleado (lo tiene el dueño).</p>
    <form id="login-form" class="row" autocomplete="off">
      <input id="login-code" type="password" inputmode="numeric" aria-label="Código de empleado" required>
      <button type="submit">Entrar</button>
    </form>
    <div id="login-status" class="status" role="status"></div>
    <p id="till-name" class="muted hidden" style="margin-bottom:0"></p>
  </section>

  <section id="lookup" class="hidden">
    <div class="card">
      <button id="live-scan" type="button" class="hidden"><span aria-hidden="true">📷</span> Escanear con la cámara</button>
      <div id="live" class="hidden">
        <video id="live-video" playsinline muted></video>
        <button id="live-stop" type="button" class="secondary">Cerrar la cámara</button>
      </div>
      <label id="photo-button" class="button" for="photo">
        <span aria-hidden="true">📷</span> Foto del código de barras
        <input id="photo" type="file" accept="image/*" capture="environment">
      </label>
      <img id="preview" class="hidden" alt="Foto recién tomada">
      <p class="muted" style="margin:12px 0 8px">Si la foto no sale clara, escriba el código de barras o el código interno:</p>
      <form id="code-form" class="row" autocomplete="off">
        <input id="code" type="text" inputmode="numeric" maxlength="32" aria-label="Código de barras o código interno">
        <button type="submit">Buscar</button>
      </form>
      <div id="status" class="status" role="status"></div>
    </div>
    <div id="result" class="card hidden" aria-live="polite"></div>
    <div id="report" class="card hidden">
      <button id="report-open" type="button" class="secondary"></button>
      <div id="report-form" class="hidden">
        <p id="report-hint" class="muted" style="margin-top:0"></p>
        <label id="report-photo-button" class="button secondary" for="report-photo">
          <span aria-hidden="true">📷</span> <span id="report-photo-label">Foto del producto</span>
          <input id="report-photo" type="file" accept="image/*" capture="environment">
        </label>
        <img id="report-preview" class="hidden" alt="Foto del producto">
        <input id="report-note" type="text" maxlength="120" placeholder="Nota (opcional)" aria-label="Nota" style="margin:12px 0">
        <button id="report-send" type="button">Enviar aviso</button>
      </div>
      <div id="report-status" class="status" role="status"></div>
    </div>
    <p class="muted">El precio se consulta en el momento en el sistema de caja. Solo funciona con el WiFi del local.</p>
  </section>
</main>
<script src="zxing.min.js"></script>
<script src="barcode-detector.js"></script>
<script src="app.js"></script>
</body>
</html>
